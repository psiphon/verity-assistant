name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # vitest 5's bundled undici needs a Node with webidl.markAsUncloneable
          # (>= 22.0 / 20.17); pin to current LTS.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Fails on any moderate+ advisory except those allowlisted (with a
      # documented reason) in audit-ci.jsonc.
      - run: npx audit-ci --config ./audit-ci.jsonc
